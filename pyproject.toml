[project]
name = "deepresearch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "langsmith>=0.1.140",
    "rank-bm25>=0.2.2",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=6.0",
    "wikipedia>=1.4.0",
    "arxiv>=2.1.0",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12",
    "pint>=0.23",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "langgraph-cli>=0.1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
