[project]
name = "deepresearch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "langsmith>=0.1.140",
    "rank-bm25>=0.2.2",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=6.0",
    "wikipedia>=1.4.0",
    "arxiv>=2.1.0",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12",
    "pint>=0.23",
    "pypdf>=6.10.2",
    "youtube-transcript-api>=1.2.4",
    "jinja2>=3.1",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=0.2"]
openai = ["langchain-openai>=0.2"]
google = ["langchain-google-genai>=2.0"]
all-llms = [
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
]

[project.scripts]
research = "deepresearch.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "langgraph-cli[inmem]>=0.1.50",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.mypy]
python_version = "3.11"
files = ["src/deepresearch"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
